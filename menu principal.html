<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Iniciar Sesión</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Capa de Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<!-- =====================================================
     1. NAVBAR PRINCIPAL
     ===================================================== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🏗️ Promaco SpA
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Inicio</a>
            <a class="nav-link" href="registro.html">Registro</a>
        </div>
    </div>
</nav>

<!-- =====================================================
     2. SECCIÓN DE INICIO DE SESIÓN Y ACCESO
     ===================================================== -->
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border p-4">
                <div class="card-body">
                    <h2 class="text-center mb-4 fw-bold text-secondary">Iniciar Sesión</h2>

                    <!-- Formulario de Login -->
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Correo electrónico</label>
                            <input type="text" id="loginEmail" class="form-control" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mb-3">
                            <label for="loginPass" class="form-label">Contraseña</label>
                            <input type="password" id="loginPass" class="form-control" placeholder="********">
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 mb-3">
                            Ingresar
                        </button>
                    </form>

                    <!-- PREGUNTA Y BOTÓN DE REGISTRO AL LADO -->
                    <div class="d-flex align-items: center justify-content-between mt-4 pt-3 border-top">
                        <span class="text-muted small m-0">¿No tienes cuenta?</span>
                        <a href="registro.html" class="btn btn-outline-primary btn-sm">
                            Regístrate con nosotros
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- =====================================================
     3. FOOTER
     ===================================================== -->
<footer class="bg-white border-top py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0 text-muted small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p>
    </div>
</footer>

</body>
</html>
