<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Menú Principal</title>

    <style>
        /* =====================================================
           ESTILOS  - CONSTRUCTORA PROMACO SPA
           ===================================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo con un sutil degradado corporativo industrial */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Barra de Navegación Superior */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid #334155;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .navbar .logo {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .navbar .menu-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .navbar .menu-links a:hover {
            color: #38bdf8;
        }

        /* Contenedor Estilo Tarjeta con Sombra Elevada */
        .formulario {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            border-top: 4px solid #0284c7; /* Acento de color institucional */
        }

        .formulario h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
            font-size: 24px;
        }

        .grupo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Efecto moderno cuando haces clic*/
        input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Sección de Registro inferior */
        .seccion-registro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            font-size: 13px;
            color: #64748b;
        }

        .btn-link-registro {
            background-color: #10b981;
            color: white;
            padding: 7px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-link-registro:hover {
            background-color: #059669;
        }
    </style>
</head>

<body>

    <!-- BARRA DE NAVEGACION SUPERIOR -->
    <div class="navbar">
        <div class="logo">🏗️ Promaco SpA</div>
        <div class="menu-links">
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registro</a>
        </div>
    </div>

    <!-- TARJETA DEL MENÚ PRINCIPAL / INICIO DE SESIÓN -->
    <form class="formulario">

        <h2>Iniciar Sesion</h2>

        <div class="grupo">
            <label for="correo">Correo Electrónico</label>
            <input type="text" id="correo" placeholder="ejemplo@promaco.cl">
        </div>

        <div class="grupo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button type="submit">Ingresar</button>

        <div class="seccion-registro">
            <span>¿No tienes cuenta?</span>
            <a href="registro.html" class="btn-link-registro">Regístrate</a>
        </div>

    </form>

</body>
</html>
